image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  ports:
    health: 9090
    grpc: 9091
    metrics: 9092

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20

observability:
  metrics:
    enabled: true
  tracing:
    enabled: true

security:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
