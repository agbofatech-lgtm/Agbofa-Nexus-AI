apiVersion: v1
kind: Service
metadata:
  name: {{ include "agbofa-service.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agbofa-service.name" . }}
  ports:
    - name: health
      port: {{ .Values.service.ports.health }}
    - name: grpc
      port: {{ .Values.service.ports.grpc }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
