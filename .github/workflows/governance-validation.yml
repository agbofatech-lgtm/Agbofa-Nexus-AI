name: Governance Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate generated registries
        run: python3 scripts/generate_registries.py --check

      - name: Validate documentation pipeline
        run: python3 scripts/documentation_pipeline.py

      - name: Run governance validators
        run: python3 governance/validators/governance_validator.py
