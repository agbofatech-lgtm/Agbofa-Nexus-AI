name: Release Governance Validation

on:
  workflow_dispatch:

jobs:
  release-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/generate_registries.py --check
      - run: python3 scripts/documentation_pipeline.py --strict
      - run: python3 scripts/validate_implementation_dependencies.py
      - run: python3 governance/validators/governance_validator.py
