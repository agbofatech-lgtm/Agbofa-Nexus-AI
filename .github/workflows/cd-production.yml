name: CD — Production Governance Gate

on:
  workflow_dispatch:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 governance/validators/governance_validator.py
      - name: Production boundary
        run: echo 'Production deployment requires explicit release authorization beyond IMP-001.'
