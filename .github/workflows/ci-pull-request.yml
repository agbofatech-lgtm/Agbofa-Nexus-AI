name: CI — Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Registry check
        run: python3 scripts/generate_registries.py --check
      - name: Documentation pipeline check
        run: python3 scripts/documentation_pipeline.py
      - name: Implementation dependency check
        run: python3 scripts/validate_implementation_dependencies.py
      - name: Governance validation
        run: python3 governance/validators/governance_validator.py
