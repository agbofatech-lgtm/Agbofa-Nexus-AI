syntax = "proto3";

package content_origination.v1;

option go_package = "github.com/agbofa/nexus-api/gen/go/content_origination/v1;originationv1";

service IngestionService {
  rpc IngestSource(IngestSourceRequest) returns (IngestSourceResponse);
  rpc GetIngestJob(GetIngestJobRequest) returns (GetIngestJobResponse);
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
}

service StoryDetectionService {
  rpc DetectStories(DetectStoriesRequest) returns (DetectStoriesResponse);
  rpc GetDetectedStory(GetDetectedStoryRequest) returns (GetDetectedStoryResponse);
}

service ContentOriginationService {
  rpc CreateOriginationStory(CreateOriginationStoryRequest) returns (CreateOriginationStoryResponse);
  rpc UpdateStoryState(UpdateStoryStateRequest) returns (UpdateStoryStateResponse);
  rpc InitializeStoryGraphNode(InitializeStoryGraphNodeRequest) returns (InitializeStoryGraphNodeResponse);
  rpc ExecuteOriginationWorkflow(ExecuteOriginationWorkflowRequest) returns (ExecuteOriginationWorkflowResponse);
}

message IngestSourceRequest {
  string tenant_id = 1;
  string source_id = 2;
  string source_type = 3; // RSS, API, SCRAPE, MANUAL
  string raw_content = 4;
  map<string, string> metadata = 5;
}

message IngestSourceResponse {
  string ingest_job_id = 1;
  string status = 2;
  int64 ingested_at_unix = 3;
}

message GetIngestJobRequest {
  string tenant_id = 1;
  string ingest_job_id = 2;
}

message GetIngestJobResponse {
  string ingest_job_id = 1;
  string status = 2;
  string normalized_text = 3;
  string error_message = 4;
}

message ListSourcesRequest {
  string tenant_id = 1;
  bool active_only = 2;
}

message SourceEntity {
  string source_id = 1;
  string name = 2;
  string source_type = 3;
  double reliability_score = 4;
  bool active = 5;
}

message ListSourcesResponse {
  repeated SourceEntity sources = 1;
}

message DetectStoriesRequest {
  string tenant_id = 1;
  string ingest_job_id = 2;
  string normalized_text = 3;
  double confidence_threshold = 4;
}

message DetectedStoryCandidate {
  string candidate_id = 1;
  string title = 2;
  string summary = 3;
  double confidence_score = 4;
  repeated string keywords = 5;
}

message DetectStoriesResponse {
  repeated DetectedStoryCandidate candidates = 1;
}

message GetDetectedStoryRequest {
  string tenant_id = 1;
  string candidate_id = 2;
}

message GetDetectedStoryResponse {
  DetectedStoryCandidate candidate = 1;
}

message CreateOriginationStoryRequest {
  string tenant_id = 1;
  string candidate_id = 2;
  string title = 3;
  string summary = 4;
  string source_id = 5;
}

message CreateOriginationStoryResponse {
  string story_id = 1;
  string status = 2;
}

message UpdateStoryStateRequest {
  string tenant_id = 1;
  string story_id = 2;
  string new_state = 3; // INGESTED, DETECTED, IDEA_GENERATED, PITCHED, SUBMITTED_FOR_VERIFICATION
  string reason = 4;
}

message UpdateStoryStateResponse {
  string story_id = 1;
  string current_state = 2;
  int64 updated_at_unix = 3;
}

message InitializeStoryGraphNodeRequest {
  string tenant_id = 1;
  string story_id = 2;
  string title = 3;
  string source_id = 4;
}

message InitializeStoryGraphNodeResponse {
  string graph_node_id = 1;
  bool initialized = 2;
}

message ExecuteOriginationWorkflowRequest {
  string tenant_id = 1;
  string workflow_id = 2;
  map<string, string> parameters = 3;
}

message ExecuteOriginationWorkflowResponse {
  string workflow_execution_id = 1;
  string status = 2;
}
