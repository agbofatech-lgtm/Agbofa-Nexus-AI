syntax = "proto3";

package runtime.agent.v1;

option go_package = "github.com/agbofa/nexus-api/gen/go/runtime/agent/v1;agentv1";

service AgentOrchestratorService {
  rpc ExecuteAgent(ExecuteAgentRequest) returns (ExecuteAgentResponse);
  rpc GetExecutionState(GetExecutionStateRequest) returns (GetExecutionStateResponse);
}

service WorkflowRuntimeService {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
}

message ExecuteAgentRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string correlation_id = 3;
  map<string, string> input_parameters = 4;
}

message ExecuteAgentResponse {
  string execution_id = 1;
  string status = 2;
  string output = 3;
  int32 tokens_used = 4;
  int64 duration_ms = 5;
}

message GetExecutionStateRequest {
  string tenant_id = 1;
  string execution_id = 2;
}

message GetExecutionStateResponse {
  string execution_id = 1;
  string agent_id = 2;
  string status = 3;
  string output = 4;
  string error_message = 5;
  int64 created_at_unix = 6;
  int64 completed_at_unix = 7;
}

message StartWorkflowRequest {
  string tenant_id = 1;
  string workflow_id = 2;
  map<string, string> payload = 3;
}

message StartWorkflowResponse {
  string instance_id = 1;
  string status = 2;
}

message CancelWorkflowRequest {
  string tenant_id = 1;
  string instance_id = 2;
  string reason = 3;
}

message CancelWorkflowResponse {
  string instance_id = 1;
  bool cancelled = 2;
}
