syntax = "proto3";

package runtime.aigateway.v1;

option go_package = "github.com/agbofa/nexus-api/gen/go/runtime/aigateway/v1;aigatewayv1";

service AIGatewayService {
  rpc InvokeModel(InvokeModelRequest) returns (InvokeModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

service PromptRegistryService {
  rpc GetPromptTemplate(GetPromptTemplateRequest) returns (GetPromptTemplateResponse);
  rpc RegisterPromptTemplate(RegisterPromptTemplateRequest) returns (RegisterPromptTemplateResponse);
}

message InvokeModelRequest {
  string tenant_id = 1;
  string model = 2;
  repeated Message messages = 3;
  double temperature = 4;
  int32 max_tokens = 5;
  map<string, string> metadata = 6;
}

message Message {
  string role = 1;
  string content = 2;
}

message InvokeModelResponse {
  string provider_id = 1;
  string model = 2;
  string content = 3;
  int32 prompt_tokens = 4;
  int32 completion_tokens = 5;
  int32 total_tokens = 6;
  int64 latency_ms = 7;
}

message ListModelsRequest {
  string tenant_id = 1;
  bool active_only = 2;
}

message ModelEndpoint {
  string model_id = 1;
  string provider_id = 2;
  string name = 3;
  bool active = 4;
  int32 max_context_tokens = 5;
}

message ListModelsResponse {
  repeated ModelEndpoint models = 1;
}

message GetPromptTemplateRequest {
  string prompt_id = 1;
  string version = 2;
}

message PromptTemplate {
  string prompt_id = 1;
  string name = 2;
  string version = 3;
  string template_string = 4;
  repeated string required_variables = 5;
  int32 max_input_length = 6;
  bool disallow_injection = 7;
}

message GetPromptTemplateResponse {
  PromptTemplate template = 1;
}

message RegisterPromptTemplateRequest {
  PromptTemplate template = 1;
}

message RegisterPromptTemplateResponse {
  string prompt_id = 1;
  string version = 2;
  bool success = 3;
}
