syntax = "proto3";

package runtime.governance.v1;

option go_package = "github.com/agbofa/nexus-api/gen/go/runtime/governance/v1;governancev1";

service EngineeringGovernanceService {
  rpc ValidateConstitutionCompliance(ValidateConstitutionComplianceRequest) returns (ValidateConstitutionComplianceResponse);
  rpc VerifyPlaybookExecution(VerifyPlaybookExecutionRequest) returns (VerifyPlaybookExecutionResponse);
}

message ValidateConstitutionComplianceRequest {
  string implementation_unit = 1;
  repeated string services = 2;
  bool check_unauthorized_scope = 3;
}

message ValidateConstitutionComplianceResponse {
  bool compliant = 1;
  repeated string violations = 2;
  string verified_by = 3;
}

message VerifyPlaybookExecutionRequest {
  string playbook_id = 1;
  string implementation_unit = 2;
  map<string, string> checklist_evidence = 3;
}

message VerifyPlaybookExecutionResponse {
  bool verified = 1;
  repeated string missing_items = 2;
  string report_hash = 3;
}
